[project]
name = "marketpulse-ai"
version = "0.1.0"
description = "Stock prediction engine using k-NN, Linear Regression, and Neural Networks"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "yfinance>=1.3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "nltk>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Přidej až budeš implementovat ai_model.py
ai = ["torch>=2.0", "transformers>=4.40"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.34"]
viz = ["plotly>=5.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.8", "mypy>=1.11", "httpx>=0.27", "pre-commit>=4.0"]
forecast = ["prophet>=1.1", "chronos-forecasting>=2.0"]
kronos = ["einops>=0.8.1", "huggingface_hub>=0.33.1"]

[project.scripts]
marketpulse = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "interface*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ------------------------------------------------------------------
# Ruff — fast linter (replaces flake8, isort, pyflakes)
# ------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, undefined names)
    "I",      # isort (import ordering)
    "UP",     # pyupgrade (modern Python syntax)
    "B",      # flake8-bugbear (common bugs)
    "SIM",    # flake8-simplify
    "ANN001", # missing type annotation for function argument
    "ANN201", # missing return type annotation for public function
    "ANN202", # missing return type annotation for private function
]
ignore = [
    "ANN001",  # TODO: enable once all functions have annotations
    "ANN201",  # TODO: enable once all functions have return types
    "ANN202",  # TODO: enable once all functions have return types
    "E501",    # line length handled by formatter
    "B905",    # zip without strict= (Python 3.10+)
    "SIM108",  # ternary operator — less readable for complex conditions
    "SIM102",  # nested if — clearer than combined for multi-line conditions
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "B", "SIM"]   # tests don't need annotations
"test_pipeline.py" = ["ANN", "B", "SIM"]

# ------------------------------------------------------------------
# Mypy — type checker
# ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
check_untyped_defs = false
explicit_package_bases = true

# Strict per-module: core engine should have annotations
[[tool.mypy.overrides]]
module = ["engine.backtester", "engine.utils"]
disallow_untyped_defs = true
check_untyped_defs = true

# Lenient for existing code (tighten gradually by moving modules above)
[[tool.mypy.overrides]]
module = ["engine.knn_model", "engine.lin_reg_model",
          "engine.features", "engine.logger",
          "engine.backtest_helpers", "engine.news_scraper", "engine.data_downloader",
          "engine.db_manager", "interface.api",
          "web.backend.*"]
disallow_untyped_defs = false

# Skip ai_model entirely (torch Optional patterns mypy can't handle)
[[tool.mypy.overrides]]
module = ["engine.ai_model", "engine.chronos_model", "engine.kronos_model"]
ignore_errors = true

# Ignore missing stubs for third-party libraries
[[tool.mypy.overrides]]
module = ["yfinance.*", "sklearn.*", "torch.*", "nltk.*", "tqdm.*",
          "pandas", "numpy", "numpy.*", "fastapi.*", "pydantic.*",
           "prophet.*", "chronos.*"]
ignore_missing_imports = true
