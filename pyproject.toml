[project]
name = "marketpulse-ai"
version = "0.1.0"
description = "Stock prediction engine using k-NN, Linear Regression, and Neural Networks"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0",
    "yfinance>=1.3",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "nltk>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
ai = ["torch>=2.0", "transformers>=4.40"]
viz = ["plotly>=5.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
marketpulse = "main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "interface*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
